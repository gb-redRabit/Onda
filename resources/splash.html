<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Onda</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
      }
      canvas {
        display: block;
      }
      .title {
        color: #e8e8f0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3px;
        animation: fadeIn 0.4s ease 0.1s both;
      }
      .status {
        color: #888;
        font-size: 11px;
        animation: fadeIn 0.4s ease 0.3s both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="viz" width="120" height="120"></canvas>
      <div class="title">Onda</div>
      <div class="status" id="status">Ładowanie biblioteki...</div>
    </div>
    <script>
      const canvas = document.getElementById('viz');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 120 * dpr;
      canvas.height = 120 * dpr;
      ctx.scale(dpr, dpr);
      const cx = 60,
        cy = 60,
        baseRadius = 24,
        count = 64;
      const values = new Float32Array(count);
      const target = new Float32Array(count);
      let time = 0;

      function randomize() {
        for (let i = 0; i < count; i++) {
          const freq = Math.sin(time * 1.8 + i * 0.3) * 0.5 + 0.5;
          const bass = i < count / 4 ? Math.sin(time * 2.4) * 0.3 + 0.3 : 0;
          const mid = i > count / 4 && i < count / 2 ? Math.sin(time * 3.1 + 1) * 0.2 + 0.2 : 0;
          const treble = i > count / 2 ? Math.sin(time * 4.5 + i * 0.15) * 0.15 + 0.1 : 0;
          target[i] = freq * 0.5 + bass + mid + treble;
        }
        if (Math.random() < 0.03) {
          const burst = Math.floor(Math.random() * count);
          const range = 8 + Math.floor(Math.random() * 12);
          for (let j = 0; j < range; j++) {
            const idx = (burst + j) % count;
            target[idx] = 0.7 + Math.random() * 0.3;
          }
        }
      }

      function draw() {
        time += 0.016;
        randomize();
        for (let i = 0; i < count; i++) values[i] += (target[i] - values[i]) * 0.12;
        ctx.clearRect(0, 0, 120, 120);
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
          const val = values[i],
            len = val * 22 + 3;
          const x1 = cx + Math.cos(angle) * baseRadius;
          const y1 = cy + Math.sin(angle) * baseRadius;
          const x2 = cx + Math.cos(angle) * (baseRadius + len);
          const y2 = cy + Math.sin(angle) * (baseRadius + len);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = 'rgba(124, 106, 239, ' + (0.25 + val * 0.75) + ')';
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        const pulse = Math.sin(time * 2) * 0.15 + 0.85;
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * pulse, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(124, 106, 239, 0.08)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * pulse, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(124, 106, 239, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        requestAnimationFrame(draw);
      }
      draw();
    </script>
  </body>
</html>
