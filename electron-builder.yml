appId: com.electron.app
productName: onda
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: onda
  # Code-signing / update verification (Windows).
  # WITHOUT a code-signing certificate you MUST keep verifyUpdateCodeSignature
  # off (false), otherwise electron-updater refuses to install unsigned builds.
  # Once you own a cert: set CODE_SIGN_PUBLISHER to the certificate subject and
  # flip verifyUpdateCodeSignature to true — publisherName must match the
  # subject used to sign the installer.
  verifyUpdateCodeSignature: false
  # publisherName: ${env.CODE_SIGN_PUBLISHER}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # to enable notarization:
  #   1. set notarize: true
  #   2. set env vars: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: gb-redRabit
  repo: Onda
  # requires GH_TOKEN env var with repo scope for releases
electronDownload:
  # mirror: https://npmmirror.com/mirrors/electron/
