appId: com.onda.app
productName: Onda
directories:
  buildResources: build
fileAssociations:
  - ext:
      - mp3
      - flac
      - ogg
      - wav
      - m4a
      - aac
      - m3u
      - m3u8
      - opus
      - mp4
      - mkv
      - webm
      - mov
      - avi
    name: Onda Media
    description: Play audio and video in Onda
    role: Viewer
    rank: Owner
    icon: build/icon.ico
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Keep a local resources/ffmpeg layout OUT of the package: FFmpeg is not
  # bundled anymore (users install the pinned build at runtime). Exclude only
  # resources/ffmpeg from the asar (avoids an accidental copy of a dev/offline
  # layout). Do NOT exclude all of resources/: resources/splash.html is loaded
  # at runtime from app.asar/resources/splash.html (src/main/index.ts) and was
  # ERR_FILE_NOT_FOUND when the whole dir was excluded.
  - '!resources/ffmpeg/**'
  # Dev-only artifacts that must NOT ship inside app.asar (basic-memory notes,
  # planning docs, tests, build tooling). electron-builder does not read
  # .gitignore, so they must be excluded explicitly or they get bundled.
  - '!{.memory,.opencode,.github,.vscode}'
  - '!{docs,tests,scripts}'
  - '!**/*.tsbuildinfo'
  - '!{.markdownlint.json,.nvmrc,vitest.config.ts,generate-random-icon.js}'
# FFmpeg/ffprobe are NOT bundled: the app downloads the pinned, SHA-256
# verified build into the user's profile (userData/bin) on demand, from
# Settings → Dependencies or the first-run wizard (see src/main/ipc/
# dependency-handlers.ts + binaries.json). This keeps installers small and
# avoids redistributing GPL/LGPL binaries. `resources/ffmpeg` is only a local
# development/offline layout (scripts/fetch-ffmpeg.mjs) and must stay out of
# the package.
# sharp dlopen()s its libvips shared library at runtime. electron-builder only
# auto-unpacks names ending in .dll/.exe/.dylib/.so/.node, but the Linux build
# ships `libvips-cpp.so.<version>` (the version suffix comes AFTER `.so`), so it
# is not detected, stays inside app.asar, and dlopen fails with "cannot open
# shared object file". Force sharp's native packages out of the asar on every
# platform (harmless where they were already unpacked, e.g. macOS .dylib).
asarUnpack:
  - '**/node_modules/@img/**'
  - '**/node_modules/sharp/**'
# Ship the full license text inside the installed app (next to app.asar in
# resources/) so it travels with every artifact on every platform. The installer
# EULA pages read build/license.txt separately (see nsis/dmg/appImage below).
extraResources:
  - from: LICENSE
    to: LICENSE
win:
  executableName: onda
  icon: build/icon.ico
  target:
    - nsis
    # `portable` deliberately not built: only installer artifacts are published.
    # (Windows auto-update uses the nsis target + latest.yml, so nothing is lost.)
  # Code-signing / update verification (Windows).
  # WITHOUT a code-signing certificate you MUST keep verifyUpdateCodeSignature
  # off (false), otherwise electron-updater refuses to install unsigned builds.
  # Once you own a cert: set CODE_SIGN_PUBLISHER to the certificate subject and
  # flip verifyUpdateCodeSignature to true — publisherName must match the
  # subject used to sign the installer.
  verifyUpdateCodeSignature: false
  # publisherName: ${env.CODE_SIGN_PUBLISHER}
nsis:
  # Localized EULA: NSIS auto-detects build/license_<lang>.txt (en, pl) when no
  # explicit `license` is set. Setting a single file here would disable the
  # per-language license pages, so it is intentionally omitted.
  displayLanguageSelector: true
  # MUI branding bitmaps (BMP, exact sizes). Regenerate after icon changes:
  #   node scripts/make-installer-bitmaps.mjs
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  # Smaller update downloads: mark the NSIS package for differential updates.
  differentialPackage: true
  oneClick: false
  perMachine: false
  # Per-machine install (perMachine: true) needs allowElevation + a signed
  # installer (UAC prompt with an unknown publisher hurts UX more than it
  # helps). Without a certificate keep per-user only.
  # allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  # NSIS MUI2 installer language selection page. en_US is the fallback,
  # pl_PL is offered alongside it.
  installerLanguages:
    - en_US
    - pl_PL
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  icon: build/icon.icns
  # Finder "Arrange by Application Category" / Launchpad grouping.
  category: public.app-category.music
  darkModeSupport: true
  target:
    - dmg
    - zip
    - pkg
  # Universal (--universal) merges the x64 + arm64 builds with lipo. sharp's
  # prebuilt Mach-O files (the .node addon + its libvips .dylib) and the bundled
  # ffmpeg/ffprobe are arch-specific yet byte-identical in both temp builds
  # (both pack the same node_modules / resources tree), so lipo refuses them.
  # x64ArchFiles makes the merge keep each copy as-is; sharp and the runtime
  # then pick the matching arch. Requires the x64 sharp packages staged in CI
  # (see build.yml). Files that genuinely differ per arch (Electron itself) are
  # still lipo'd — this rule only matches the identical ones.
  x64ArchFiles: '**/{@img/**,*.node,*.dylib,ffmpeg/**}'
  # Universal (arm64+x64) is built with `-- --universal` (see CI build.yml);
  # "universal" is NOT a valid MacOsTargetName. ZIP is mandatory for
  # electron-updater on macOS. Notarization/signing require Apple credentials:
  #   - electron-builder needs to run on macOS (it does - CI macos job)
  #   - enable mac.notarize + APPLE_* secrets, then dmg sign/staple
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # to enable notarization:
  #   1. set notarize: true
  #   2. set env vars: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
pkg:
  # macOS installer wizard — the equivalent of the NSIS license page: a
  # Welcome page, the EULA, then a Conclusion page, over a branded background.
  welcome: build/mac/welcome.html
  license: build/license_en.txt
  conclusion: build/mac/conclusion.html
  background:
    file: build/pkg-background.png
    alignment: center
    scaling: tofit
  # Install-location options (mirrors the NSIS install-mode choice).
  allowCurrentUserHome: true
  allowRootDirectory: true
  allowAnywhere: false
  # Reinstall / upgrade behaviour.
  isVersionChecked: true
  isRelocatable: false
  overwriteAction: upgrade
  # Signing a .pkg needs a "Developer ID Installer" certificate; until one is
  # provisioned the package ships unsigned (see mac.notarize above).
dmg:
  artifactName: ${name}-${version}.${ext}
  # License agreement shown when the DMG is mounted (English; DMG has no
  # per-language license pages).
  license: build/license_en.txt
  # Custom background (generated by scripts/make-installer-bitmaps.mjs).
  background: build/dmg-background.png
  # Volume icon + icon sizing inside the mounted disk image.
  icon: build/icon.icns
  iconSize: 96
  title: Onda ${version}
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 180
    - x: 400
      y: 180
linux:
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  # snap removed on purpose (see plan 10.3): strict confinement can't see
  # system ffmpeg and stage-packages would duplicate the bundled binary.
  # CI never built snap either (explicit `--linux AppImage deb`), so keeping
  # it only in the config risked accidental `build:linux` snap builds.
  icon: icon.png
  maintainer: gb-redRabit
  category: AudioVideo
  # Aligns the generated .desktop filename with Electron's app_id / WM_CLASS
  # (desktopName in package.json) so GNOME links windows to the .desktop entry.
  syncDesktopName: true
  # Enrich the generated .desktop entry (menu category, search keywords,
  # window-to-launcher matching).
  desktop:
    entry:
      Name: Onda
      GenericName: Media Player
      Comment: Play local and online audio and video
      Keywords: media;player;music;video;audio;youtube;soundcloud;playlist;
      Categories: AudioVideo;Audio;Video;Player;
      StartupWMClass: onda
  synopsis: Fast, privacy-friendly cross-platform media player
  description: Onda streams audio and video from online sources, manages your
    local library and downloads media through yt-dlp and plugins.
deb:
  # Debian Section. `sound` is a valid archive section matching a media
  # player better than the default derived from category.
  packageCategory: sound
  priority: optional
  # depends keeps electron-builder defaults (libgtk-3-0, libnss3, ...).
  # No ffmpeg dependency either way: the app never bundles it and installs the
  # pinned build into the user's profile on demand.
appImage:
  # EULA license file bundled into the AppImage (plain text only).
  license: build/license_en.txt
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: gb-redRabit
  repo: Onda
  # release-please (release.yml) owns the published release for the tag; upload
  # into it rather than letting electron-builder create a second one. With the
  # default "draft" releaseType electron-builder ignores an existing published
  # release, and electron-builder#10026 makes concurrent artifact uploads each
  # create a *separate* release when none is found — one asset then 404s (seen
  # on the Linux .rpm). The "Ensure GitHub release exists" step in build.yml
  # guarantees the release is present before any upload starts.
  releaseType: release
  # requires GH_TOKEN env var with repo scope for releases
  # Beta channel: stable releases go to the default "latest". For a beta
  # stream either pass --config.publish.channel=beta on the electron-builder
  # CLI (electron-updater then ships beta in app-update.yml) or mark the GH
  # release as prerelease (channel="beta" for prereleases). Choose when the
  # per-platform channel story is settled; single stable channel for now.
electronDownload:
  # mirror: https://npmmirror.com/mirrors/electron/
