name: Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Walidacja PR-ów (w tym Dependabot i release-please) ZANIM trafią do main.
  # Kroki budujące/publikujące instalatory są niżej wyłączone dla PR.
  pull_request:
  workflow_dispatch:

# Jeden przebieg na ref: kolejne pushe anulują poprzedni, a PR-y nie blokują main.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            # Installers only: AppImage + deb + rpm. `tar.gz` (a plain archive,
            # not an installer) is left out; Linux auto-update uses AppImage.
            args: --linux AppImage deb rpm
          - os: macos-latest
            args: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # version:check compares the tree against the newest v* tag, so the
          # tags have to be present. The history is ~350 commits, so a full
          # fetch costs nothing next to the three matrix builds below.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # release-please owns the version. This fails if someone hand-edited
      # package.json, which is what makes the repo and the published release
      # disagree. See RELEASE.md §2.
      - name: Check version ownership
        run: npm run version:check

      - name: Test (with coverage gate)
        run: npm run test:coverage

      - name: Audit production dependencies
        # Tylko zależności produkcyjne (dev-only advisories z toolchainu nie
        # blokują wydania). Próg high — moderate zostają widoczne w logu.
        run: npm audit --omit=dev --audit-level=high

      # A test that writes through a relative path leaves a file in the repo
      # root, and on Linux/macOS the next step fails on it with a confusing
      # prettier warning. Fail here instead, naming the file.
      - name: Check tests left no artifacts
        run: npm run check:artifacts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Check empty catch blocks
        run: npm run check:catch

      - name: Check generated IPC files are up to date
        run: npm run ipc:gen:check

      - name: Build
        run: npm run build

      # Testy narzędzi FFmpeg mają działać także na czystym runnerze, a nie
      # tylko na maszynie z `%APPDATA%\onda\bin`. Helper E2E szuka binarek
      # w profilu, resources/ffmpeg i PATH.
      - name: Install FFmpeg for tool E2E
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            choco install ffmpeg --no-progress -y
          fi

      - name: E2E (Electron, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e

      - name: E2E (Electron)
        if: runner.os != 'Linux'
        run: npm run e2e

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

      # FFmpeg is not bundled anymore: users install the pinned, SHA-256
      # verified build into their profile from Settings → Dependencies (or the
      # first-run wizard). Nothing to fetch/cache here.

      # Universal mac packs x64 + arm64 from the SAME node_modules, which only
      # holds the host-arch (arm64) sharp binaries — the merge then fails on the
      # identical Mach-O (see electron-builder.yml x64ArchFiles), and worse,
      # Intel Macs would ship arm64 binaries. Stage the x64 sharp + libvips
      # packages directly (self-contained, no deps); `npm install --cpu=x64`
      # would reify and prune the arm64 twins. Versions follow sharp's own
      # optionalDependencies so they never rot on dependabot bumps.
      - name: Stage x64 sharp for universal mac
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          sharp_ver=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-darwin-x64']")
          vips_ver=$(node -p "require('./node_modules/sharp/package.json').optionalDependencies['@img/sharp-libvips-darwin-x64']")
          npm pack "@img/sharp-darwin-x64@$sharp_ver" --pack-destination "$RUNNER_TEMP"
          npm pack "@img/sharp-libvips-darwin-x64@$vips_ver" --pack-destination "$RUNNER_TEMP"
          mkdir -p node_modules/@img/sharp-darwin-x64 node_modules/@img/sharp-libvips-darwin-x64
          tar -xzf "$RUNNER_TEMP"/img-sharp-darwin-x64-*.tgz -C node_modules/@img/sharp-darwin-x64 --strip-components=1
          tar -xzf "$RUNNER_TEMP"/img-sharp-libvips-darwin-x64-*.tgz -C node_modules/@img/sharp-libvips-darwin-x64 --strip-components=1

      # electron-builder#10026: while publishing one build, its concurrent
      # artifact uploads each create their own GitHub release when none exists
      # yet, and an upload can then 404 against a superseded release (observed
      # on the Linux .rpm). Create the release once here so every upload — and
      # every matrix job — targets the same id. release-please (release.yml)
      # normally creates it already, in which case this is a no-op.
      - name: Ensure GitHub release exists
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          list_releases() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          }
          if list_releases | grep -qxF "$GITHUB_REF_NAME"; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "" \
              || list_releases | grep -qxF "$GITHUB_REF_NAME"
          fi

      - name: Build installers
        # PR-y tylko walidują (test/build/e2e). Instalatory budujemy bez
        # publikacji; upload następuje dopiero po smoke testach i tylko dla tagu.
        if: github.event_name != 'pull_request'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Code signing is OFF until certificates are provisioned. See
          # RELEASE.md §6 and electron-builder.yml (win.publisherName /
          # verifyUpdateCodeSignature, mac.notarize).
          #
          # Do NOT add empty CSC_LINK/CSC_KEY_PASSWORD vars here — electron-builder
          # treats even an empty CSC_LINK as a cert path and fails (macOS: "not a
          # file"). When certs are available, add the real secrets and:
          #   - Windows: CSC_LINK, CSC_KEY_PASSWORD (or CODE_SIGN_PUBLISHER for
          #     publisherName + verifyUpdateCodeSignature: true).
          #   - macOS: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
          #     APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarize: true).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Smoke test installer (Windows)
        if: matrix.os == 'windows-latest' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          # The packaged app is a GUI app with no `--version` and no self-exit,
          # so `& onda.exe --version` can hang. Bound the run and assert it
          # reached the boot milestone instead.
          $out = "$env:RUNNER_TEMP\onda-smoke.log"
          $err = "$env:RUNNER_TEMP\onda-smoke.err"
          $p = Start-Process -FilePath "${{ github.workspace }}\dist\win-unpacked\onda.exe" `
            -ArgumentList "--no-sandbox" -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 20
          if (-not $p.HasExited) { $p.Kill() }
          Get-Content $out, $err -ErrorAction SilentlyContinue
          if (-not (Select-String -Path $out, $err -Pattern '\[Onda/boot\] window created' -Quiet)) {
            throw "packaged app did not reach the 'window created' boot milestone"
          }

      - name: Smoke test unpacked app (Linux)
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        run: |
          set +e
          chmod +x "${{ github.workspace }}/dist/linux-unpacked/onda"
          # Headless CI: no root-owned, mode-4755 chrome-sandbox (Chromium's SUID
          # sandbox aborts at startup) and no X display, so run under Xvfb with
          # the sandbox off. This is a GUI app, not a CLI — it has no `--version`
          # and does not exit on its own — so bound the run and assert it reached
          # the "window created" boot milestone (proves the main process started,
          # sharp loaded, and a window was built under the virtual display).
          log="$RUNNER_TEMP/onda-smoke.log"
          xvfb-run -a timeout -k 5 30 "${{ github.workspace }}/dist/linux-unpacked/onda" --no-sandbox >"$log" 2>&1
          echo "launcher exit=$? (124 = timeout, expected for a GUI app)"
          cat "$log"
          grep -q "\[Onda/boot\] window created" "$log"

      - name: Smoke test unpacked app (macOS)
        if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find dist -maxdepth 3 -name 'Onda.app' -type d | head -n 1)"
          if [ -z "$app" ]; then
            echo "Onda.app not found in dist/" >&2
            exit 1
          fi
          log="$RUNNER_TEMP/onda-smoke.log"
          profile="$RUNNER_TEMP/onda-smoke-profile"
          mkdir -p "$profile"
          ONDA_USER_DATA_DIR="$profile" "$app/Contents/MacOS/Onda" --no-sandbox >"$log" 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then kill "$pid" 2>/dev/null || true; fi
          wait "$pid" 2>/dev/null || true
          cat "$log"
          grep -q "\[Onda/boot\] window created" "$log"

      # Publikacja jest osobnym, ostatnim krokiem. Dzięki temu uszkodzony
      # installer/`latest.yml` nigdy nie trafi do wydania przed smoke testem,
      # a workflow_dispatch (gałąź main) nie nadpisuje assetów ostatniego tagu.
      - name: Publish installers (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.pkg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
          )
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No installer artifacts found in dist/" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" --clobber

          # Manifesty auto-update publikujemy na końcu: jeżeli upload
          # instalatora padnie, użytkownicy nie zobaczą nowego `latest.yml`.
          manifests=(dist/latest.yml dist/latest-linux.yml dist/latest-mac.yml)
          if [ ${#manifests[@]} -gt 0 ]; then
            gh release upload "$GITHUB_REF_NAME" "${manifests[@]}" --clobber
          fi
