name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build & Publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          # Code signing is OFF until certificates are provisioned. See
          # RELEASE.md §6 and electron-builder.yml (win.publisherName /
          # verifyUpdateCodeSignature, mac.notarize).
          #
          # Do NOT add empty CSC_LINK/CSC_KEY_PASSWORD vars here — electron-builder
          # treats even an empty CSC_LINK as a cert path and fails (macOS: "not a
          # file"). When certs are available, add the real secrets and:
          #   - Windows: CSC_LINK, CSC_KEY_PASSWORD (or CODE_SIGN_PUBLISHER for
          #     publisherName + verifyUpdateCodeSignature: true).
          #   - macOS: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
          #     APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarize: true).
          CSC_IDENTITY_AUTO_DISCOVERY: false
