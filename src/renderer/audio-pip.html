<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Onda Audio PiP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;user-select:none;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e0e0e0;position:relative}
#bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;transition:background .25s}
#viz{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.1}
#w{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column}
#p{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,0.12);cursor:pointer;z-index:3}
#p:hover{height:5px;background:rgba(255,255,255,0.18)}
#f{height:100%;background:linear-gradient(90deg,#7c6aef,#9b8cf5);width:0%;border-radius:0 2px 2px 0}

/* === minimal === */
body[data-m="m"] #bg{background:rgba(26,26,46,0.55)}
body[data-m="m"]:hover #bg{background:rgba(26,26,46,0.88)}
body[data-m="m"] #w{flex-direction:row;align-items:center;padding:0 8px;gap:4px;height:100%}
body[data-m="m"] #cover,body[data-m="m"] #info,body[data-m="m"] #top,body[data-m="m"] #tm,body[data-m="m"] #vol,body[data-m="m"] #eqr,body[data-m="m"] #nq{display:none}
body[data-m="m"] #tn-m{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
body[data-m="m"] #bot{display:flex;align-items:center;gap:2px;flex-shrink:0}
body[data-m="m"] .m-hide{display:none}

/* === medium === */
body[data-m="d"] #bg{background:rgba(26,26,46,0.6)}
body[data-m="d"]:hover #bg{background:rgba(26,26,46,0.9)}
body[data-m="d"] #tn-m,.d-hide{display:none}
body[data-m="d"] #top{display:flex;flex:1;align-items:center;padding:8px 10px 0 10px;gap:10px;min-height:0}
body[data-m="d"] #cover{display:block;width:76px;height:76px;border-radius:8px;overflow:hidden;flex-shrink:0}
body[data-m="d"] #info{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:center;gap:2px}
body[data-m="d"] #tm{display:block;font-size:11px;color:#aaa;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
body[data-m="d"] #vol{display:flex;gap:4px;align-items:center;flex-shrink:0}
body[data-m="d"] #bot{display:flex;align-items:center;justify-content:center;padding:4px 10px 6px 10px;gap:6px;flex-shrink:0}
body[data-m="d"] #eqr,body[data-m="d"] #nq{display:none}
body[data-m="d"] #mt{margin-left:auto}

/* === max === */
body[data-m="x"] #bg{background:rgba(26,26,46,0.5)}
body[data-m="x"]:hover #bg{background:rgba(26,26,46,0.85)}
body[data-m="x"] #tn-m,.x-hide{display:none}
body[data-m="x"] #top{display:flex;flex:1;align-items:center;padding:6px 10px 0 10px;gap:10px;min-height:0}
body[data-m="x"] #cover{display:block;width:64px;height:64px;border-radius:7px;overflow:hidden;flex-shrink:0}
body[data-m="x"] #info{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:center;gap:2px}
body[data-m="x"] #tm{display:block;font-size:11px;color:#aaa;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
body[data-m="x"] #vol{display:flex;gap:4px;align-items:center;flex-shrink:0}
body[data-m="x"] #bot{display:flex;align-items:center;padding:2px 10px 6px 10px;gap:4px;flex-shrink:0}
body[data-m="x"] #eqr{display:flex;align-items:center;gap:2px;flex-shrink:0}
body[data-m="x"] #nq{display:flex;font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;flex-shrink:1}
body[data-m="x"] #mt{margin-left:auto}

#cover img{width:100%;height:100%;object-fit:cover;display:block}
#tn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ar{font-size:11px;color:#a0a0a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.b{border:none;background:transparent;color:#ccc;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:all .12s;flex-shrink:0;font-family:inherit}
.b:hover{background:rgba(255,255,255,0.12);color:#fff}
body[data-m="m"] .b{width:24px;height:24px;font-size:12px}
body[data-m="d"] .b{width:28px;height:28px;font-size:13px}
body[data-m="x"] .b{width:28px;height:28px;font-size:13px}
.bp{background:rgba(124,106,239,0.2);color:#7c6aef;border-radius:50%}
.bp:hover{background:rgba(124,106,239,0.4);color:#9b8cf5}
#mt .b{font-size:12px;width:22px;height:22px;color:#666}
#mt .b:hover{color:#aaa}
#vol-slider{width:60px;height:3px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.2);border-radius:2px;outline:none;cursor:pointer}
#vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#7c6aef;border:none;cursor:pointer}
#vol-val{font-size:10px;color:#aaa;min-width:26px;text-align:right}
.eq-bar{width:3px;border-radius:2px;background:#7c6aef;transition:height .15s;flex-shrink:0;min-height:2px}
</style>
</head>
<body data-m="m">
<div id="bg"></div>
<canvas id="viz"></canvas>
<div id="w">
  <div id="tn-m">—</div>
  <div id="top">
    <div id="cover"><img id="cv" src="" alt="" /></div>
    <div id="info">
      <div id="tn">—</div>
      <div id="ar"></div>
    </div>
    <div id="tm">0:00 / 0:00</div>
    <div id="vol">
      <button class="b" id="vb">🔊</button>
      <input type="range" id="vs" min="0" max="1" step="0.05" value="1" />
      <span id="vv">100%</span>
    </div>
  </div>
  <div id="bot">
    <button class="b m-hide" id="sh">⤵</button>
    <button class="b" id="pr">⏮</button>
    <button class="b bp" id="pl">▶</button>
    <button class="b" id="nx">⏭</button>
    <button class="b m-hide" id="rp">↻</button>
    <div id="eqr"></div>
    <div id="nq"></div>
    <div id="mt"><button class="b" id="mb">▣</button></div>
  </div>
</div>
<div id="p"><div id="f"></div></div>
<script>
;(function(){
  var D = document, Bd = D.body, $ = D.getElementById.bind(D)
  var tn = $('tn'), tnm = $('tn-m'), ar = $('ar'), pl = $('pl'), pf = $('f'), pw = $('p')
  var tm = $('tm'), cv = $('cv'), vs = $('vs'), vb = $('vb'), vv = $('vv')
  var sh = $('sh'), rp = $('rp'), mb = $('mb'), eqr = $('eqr'), nq = $('nq'), bg = $('bg')
  var over = false, curOpacity = 0.85, mode = 'm', muted = false
  var canvas = $('viz'), ctx = canvas.getContext('2d')
  var animId = null

  function rc(){ canvas.width = Bd.clientWidth; canvas.height = Bd.clientHeight }
  rc(); window.addEventListener('resize', rc)

  function dv(){
    var w = canvas.width, h = canvas.height
    if (w === 0 || h === 0) { animId = requestAnimationFrame(dv); return }
    ctx.clearRect(0, 0, w, h)
    var n = 48, bw = (w / n) * 0.55, gap = (w / n) * 0.45, mid = h / 2, now = Date.now()
    for (var i = 0; i < n; i++) {
      var amp = (Math.sin(now / 300 + i * 0.4) * 0.4 + 0.6) * mid * 0.55
      ctx.fillStyle = '#7c6aef'
      ctx.globalAlpha = 0.2 + Math.sin(now / 500 + i * 0.2) * 0.12
      ctx.fillRect(i * (bw + gap), mid - amp, bw, amp * 2)
    }
    ctx.globalAlpha = 1
    animId = requestAnimationFrame(dv)
  }
  function sv(){ if (mode === 'x' && !animId) dv() }
  function xv(){ if (animId) { cancelAnimationFrame(animId); animId = null }; ctx.clearRect(0, 0, canvas.width, canvas.height) }

  function send(a){ if(window.api) window.api.send('audio-pip:action', a) }

  function fmt(t){
    if (isNaN(t) || t < 0) return '0:00'
    var m = Math.floor(t / 60), s = Math.floor(t % 60)
    return m + ':' + (s < 10 ? '0' : '') + s
  }

  function vi(v, m){ return m ? '🔇' : v === 0 ? '🔇' : v < 0.33 ? '🔈' : v < 0.66 ? '🔉' : '🔊' }

  function sa(a){
    curOpacity = a
    var b = over ? 0.9 : Math.min(0.85, a * 0.65)
    bg.style.background = 'rgba(26,26,46,' + b + ')'
  }

  function sm(m){
    mode = m; Bd.dataset.m = m; sa(curOpacity)
    if (m === 'x') sv(); else xv()
  }

  function re(bands){
    if (!eqr) return
    if (!bands || bands.length === 0) { eqr.innerHTML = ''; return }
    eqr.innerHTML = bands.map(function(v){ return '<div class="eq-bar" style="height:' + Math.max(2, (v + 12) / 24 * 24) + 'px"></div>' }).join('')
  }

  function render(s){
    var name = s.trackName || '—'
    tn.textContent = name; tnm.textContent = name
    ar.textContent = s.artist || ''
    if (s.coverData) { cv.src = s.coverData; cv.style.display = 'block' }
    else { cv.src = ''; cv.style.display = 'none' }
    pl.textContent = s.isPlaying ? '⏸' : '▶'

    if (s.currentTime !== undefined && s.duration !== undefined) {
      var d = s.duration > 0 ? s.duration : 0
      pf.style.width = Math.min(d > 0 ? (s.currentTime / d) * 100 : 0, 100) + '%'
      tm.textContent = fmt(s.currentTime) + ' / ' + fmt(d)
    }

    if (s.volume !== undefined) {
      var v = +s.volume
      muted = !!s.isMuted
      vs.value = String(v)
      vb.textContent = vi(v, muted)
      vv.textContent = Math.round(v * 100) + '%'
    }

    if (s.equalizerBands) re(s.equalizerBands)
    if (s.nextTrackName && nq) {
      nq.textContent = s.nextTrackArtist ? '↳ ' + s.nextTrackName + ' — ' + s.nextTrackArtist : '↳ ' + s.nextTrackName
    } else if (nq) { nq.textContent = '' }
  }

  Bd.onmouseenter = function(){ over = true; sa(curOpacity) }
  Bd.onmouseleave = function(){ over = false; sa(curOpacity) }
  Bd.ondblclick = function(){ if(window.api) window.api.send('audio-pip:showMain') }

  pl.onclick = function(){ send('playPause') }
  $('pr').onclick = function(){ send('prev') }
  $('nx').onclick = function(){ send('next') }
  sh.onclick = function(){ send('shuffle') }
  rp.onclick = function(){ send('repeat') }
  mb.onclick = function(){ send('cycleMode') }

  vs.oninput = function(){
    var v = parseFloat(vs.value)
    vb.textContent = vi(v, muted); vv.textContent = Math.round(v * 100) + '%'
    send('volume:' + v.toFixed(2))
  }
  vb.onclick = function(){ send('mute') }

  pw.onclick = function(e){
    var r = pw.getBoundingClientRect()
    var pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))
    if(window.api) window.api.send('audio-pip:progressClick', pct)
  }

  if (window.api) {
    window.api.on('audio-pip:update', function(){
      var d = arguments[0]
      if (d.mode && d.mode !== mode) sm(d.mode === 'max' ? 'x' : d.mode === 'medium' ? 'd' : 'm')
      if (d.state) render(d.state)
      if (d.opacity !== undefined) sa(d.opacity)
    })
  }

  render({ trackName: '', artist: '', coverData: null, isPlaying: false, currentTime: 0, duration: 0, volume: 1 })
  sa(0.85); sm('m')
})()
</script>
</body>
</html>
