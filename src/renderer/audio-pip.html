<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Onda Audio PiP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;user-select:none;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e0e0e0;position:relative;transition:none}

/* background layer — fades on unhover */
#bg{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(26,26,46,0.85);z-index:0;transition:background .25s}
body[data-m="m"] #bg{background:rgba(26,26,46,0.6)}
body[data-m="m"]:hover #bg{background:rgba(26,26,46,0.9)}
body[data-m="d"] #bg{background:rgba(26,26,46,0.65)}
body[data-m="d"]:hover #bg{background:rgba(26,26,46,0.92)}
body[data-m="x"] #bg{background:rgba(26,26,46,0.55)}
body[data-m="x"]:hover #bg{background:rgba(26,26,46,0.88)}

#viz{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.12}
#w{display:flex;position:relative;z-index:2;width:100%;height:100%;flex-direction:column}

/* === minimal === */
body[data-m="m"] #w{height:40px;padding:0 8px;gap:4px;flex-direction:row;align-items:center}
body[data-m="m"] #cover,body[data-m="m"] #info,body[data-m="m"] #tm,body[data-m="m"] #vol,body[data-m="m"] #eqr,body[data-m="m"] #nq{display:none}
body[data-m="m"] #tn-m{display:block;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}

/* === medium === */
body[data-m="d"] #w{height:120px;padding:8px 10px;gap:6px;flex-direction:row;align-items:center}
body[data-m="d"] #tn-m{display:none}
body[data-m="d"] #cover{display:block;width:56px;height:56px;border-radius:6px;overflow:hidden;flex-shrink:0}
body[data-m="d"] #info{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:center;gap:1px}
body[data-m="d"] #tm{display:block;font-size:10px;color:#aaa;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
body[data-m="d"] #vol{display:flex}
body[data-m="d"] #eqr,body[data-m="d"] #nq{display:none}
body[data-m="d"] .mx{display:none}

/* === max === */
body[data-m="x"] #w{padding:5px 10px;gap:3px;flex-direction:row;align-items:center;flex-wrap:wrap;align-content:center}
body[data-m="x"] #tn-m{display:none}
body[data-m="x"] #cover{display:block;width:48px;height:48px;border-radius:5px;overflow:hidden;flex-shrink:0}
body[data-m="x"] #info{display:flex;flex:1;min-width:0;flex-direction:column;justify-content:center;gap:1px}
body[data-m="x"] #tm{display:block;font-size:10px;color:#aaa;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
body[data-m="x"] #vol{display:flex}
body[data-m="x"] #eqr{display:flex;align-items:center;gap:2px;flex-shrink:0;order:10}
body[data-m="x"] #nq{display:flex;font-size:9px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;flex-shrink:1;order:11}
body[data-m="x"] .mx{display:flex}
body[data-m="x"] #ctrls{order:5}
body[data-m="x"] #mt{order:12;margin-left:auto}

#cover img{width:100%;height:100%;object-fit:cover;display:block}
#tn{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ar{font-size:10px;color:#a0a0a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctrls{display:flex;align-items:center;flex-shrink:0}
body[data-m="m"] #ctrls{gap:2px}
body[data-m="d"] #ctrls{gap:3px}
body[data-m="x"] #ctrls{gap:3px}

.b{border:none;background:transparent;color:#ccc;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:4px;transition:all .12s;flex-shrink:0}
.b:hover{background:rgba(255,255,255,0.12);color:#fff}
body[data-m="m"] .b{width:24px;height:24px;font-size:12px}
body[data-m="d"] .b{width:28px;height:28px;font-size:13px}
body[data-m="x"] .b{width:26px;height:26px;font-size:12px}
.bp{background:rgba(124,106,239,0.25);color:#7c6aef;border-radius:50%}
.bp:hover{background:rgba(124,106,239,0.45);color:#9b8cf5}
.mx{display:none}

/* mode toggle */
#mt .b{font-size:11px;width:20px;height:20px;color:#666}
#mt .b:hover{color:#aaa}

#p{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,0.12);cursor:pointer;z-index:3}
#p:hover{height:5px;background:rgba(255,255,255,0.18)}
#f{height:100%;background:linear-gradient(90deg,#7c6aef,#9b8cf5);width:0%;border-radius:0 2px 2px 0}

#vol{gap:3px;flex-shrink:0;align-items:center}
body[data-m="x"] #vol{gap:2px}
#vol-slider{width:50px;height:3px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.2);border-radius:2px;outline:none;cursor:pointer}
#vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#7c6aef;border:none;cursor:pointer}
body[data-m="x"] #vol-slider{width:60px}
#vol-val{font-size:9px;color:#aaa;min-width:24px;text-align:right;display:none}
body[data-m="x"] #vol-val{display:block}
body[data-m="d"] #vol-val{display:block;min-width:20px}
body[data-m="d"] #vol-slider{width:40px}

/* EQ bars */
.eq-bar{width:4px;border-radius:2px;background:#7c6aef;transition:height .15s;flex-shrink:0;min-height:2px}
</style>
</head>
<body data-m="m">
<div id="bg"></div>
<canvas id="viz"></canvas>
<div id="w">
  <div id="cover"><img id="cv" src="" alt="" /></div>
  <div id="tn-m">—</div>
  <div id="info">
    <div id="tn">—</div>
    <div id="ar"></div>
  </div>
  <div id="ctrls">
    <button class="b mx" id="sh">⤵</button>
    <button class="b" id="pr">⏮</button>
    <button class="b bp" id="pl">▶</button>
    <button class="b" id="nx">⏭</button>
    <button class="b mx" id="rp">↻</button>
  </div>
  <div id="tm">0:00 / 0:00</div>
  <div id="vol">
    <button class="b" id="vb">🔊</button>
    <input type="range" id="vs" min="0" max="1" step="0.05" value="1" />
    <span id="vv">100%</span>
  </div>
  <div id="eqr"></div>
  <div id="nq"></div>
  <div id="mt"><button class="b" id="mb">▣</button></div>
</div>
<div id="p"><div id="f"></div></div>
<script>
;(function(){
  var D = document, Bd = D.body, $ = D.getElementById.bind(D)
  var tn = $('tn'), tnm = $('tn-m'), ar = $('ar'), pl = $('pl'), pf = $('f'), pw = $('p')
  var tm = $('tm'), cv = $('cv'), vs = $('vs'), vb = $('vb'), vv = $('vv')
  var sh = $('sh'), rp = $('rp'), mb = $('mb'), eqr = $('eqr'), nq = $('nq'), bg = $('bg')
  var over = false, curOpacity = 0.85, mode = 'm'
  var canvas = $('viz'), ctx = canvas.getContext('2d')
  var animId = null, vizBars = 48

  function resizeCanvas(){
    canvas.width = Bd.clientWidth
    canvas.height = Bd.clientHeight
  }
  resizeCanvas()
  window.addEventListener('resize', resizeCanvas)

  function drawViz(){
    var w = canvas.width, h = canvas.height
    if (w === 0 || h === 0) { animId = requestAnimationFrame(drawViz); return }
    ctx.clearRect(0, 0, w, h)
    var barW = (w / vizBars) * 0.55, gap = (w / vizBars) * 0.45
    var mid = h / 2
    for (var i = 0; i < vizBars; i++) {
      var t = Date.now() / 300 + i * 0.4
      var amp = (Math.sin(t) * 0.4 + 0.6) * mid * 0.6
      ctx.fillStyle = '#7c6aef'
      ctx.globalAlpha = 0.25 + Math.sin(Date.now() / 500 + i * 0.2) * 0.15
      ctx.fillRect(i * (barW + gap), mid - amp, barW, amp * 2)
    }
    ctx.globalAlpha = 1
    animId = requestAnimationFrame(drawViz)
  }

  function startViz(){
    if (mode !== 'x') return
    if (!animId) drawViz()
  }
  function stopViz(){
    if (animId) { cancelAnimationFrame(animId); animId = null }
    ctx.clearRect(0, 0, canvas.width, canvas.height)
  }

  function send(a){ if(window.api) window.api.send('audio-pip:action', a) }

  function fmt(t){
    if (isNaN(t) || t < 0) return '0:00'
    var m = Math.floor(t / 60), s = Math.floor(t % 60)
    return m + ':' + (s < 10 ? '0' : '') + s
  }

  function setAlpha(a){
    curOpacity = a
    if (mode === 'm') bg.style.background = 'rgba(26,26,46,' + (over ? 0.9 : a * 0.6) + ')'
    else if (mode === 'd') bg.style.background = 'rgba(26,26,46,' + (over ? 0.92 : a * 0.65) + ')'
    else bg.style.background = 'rgba(26,26,46,' + (over ? 0.88 : a * 0.55) + ')'
  }

  function setMode(m){
    mode = m
    Bd.dataset.m = m
    setAlpha(curOpacity)
    if (m === 'x') startViz(); else stopViz()
  }

  function renderEq(bands){
    if (!eqr) return
    if (!bands || bands.length === 0) { eqr.innerHTML = ''; return }
    var html = ''
    for (var i = 0; i < bands.length; i++) {
      var h = Math.max(2, (bands[i] + 12) / 24 * 28)
      html += '<div class="eq-bar" style="height:' + h + 'px"></div>'
    }
    eqr.innerHTML = html
  }

  function render(s){
    var name = s.trackName || '—'
    tn.textContent = name
    tnm.textContent = name
    ar.textContent = s.artist || ''

    if (s.coverData) {
      cv.src = s.coverData
      cv.style.display = 'block'
    } else {
      cv.src = ''
      cv.style.display = 'none'
    }

    pl.textContent = s.isPlaying ? '⏸' : '▶'

    if (s.currentTime !== undefined && s.duration !== undefined) {
      var d = s.duration > 0 ? s.duration : 0
      var pct = d > 0 ? (s.currentTime / d) * 100 : 0
      pf.style.width = Math.min(pct, 100) + '%'
      tm.textContent = fmt(s.currentTime) + ' / ' + fmt(d)
    }

    if (s.volume !== undefined) {
      vs.value = String(s.volume)
      var v = s.volume
      vb.textContent = v === 0 ? '🔇' : v < 0.33 ? '🔈' : v < 0.66 ? '🔉' : '🔊'
      vv.textContent = Math.round(v * 100) + '%'
    }

    if (s.equalizerBands) renderEq(s.equalizerBands)
    if (s.nextTrackName && nq) {
      nq.textContent = s.nextTrackArtist ? '↳ ' + s.nextTrackName + ' — ' + s.nextTrackArtist : '↳ ' + s.nextTrackName
    } else if (nq) {
      nq.textContent = ''
    }
  }

  Bd.onmouseenter = function(){ over = true; setAlpha(curOpacity) }
  Bd.onmouseleave = function(){ over = false; setAlpha(curOpacity) }
  Bd.ondblclick = function(){ if(window.api) window.api.send('audio-pip:showMain') }

  pl.onclick = function(){ send('playPause') }
  $('pr').onclick = function(){ send('prev') }
  $('nx').onclick = function(){ send('next') }
  if (sh) sh.onclick = function(){ send('shuffle') }
  if (rp) rp.onclick = function(){ send('repeat') }
  if (mb) mb.onclick = function(){ send('cycleMode') }

  vs.oninput = function(){
    var v = parseFloat(vs.value)
    vb.textContent = v === 0 ? '🔇' : v < 0.33 ? '🔈' : v < 0.66 ? '🔉' : '🔊'
    vv.textContent = Math.round(v * 100) + '%'
    send('volume:' + v.toFixed(2))
  }

  vb.onclick = function(){ send('mute:' + (vb.textContent === '🔇' ? '0' : '1')) }

  pw.onclick = function(e){
    var r = pw.getBoundingClientRect()
    var pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))
    if(window.api) window.api.send('audio-pip:progressClick', pct)
  }

  if (window.api) {
    window.api.on('audio-pip:update', function(){
      var d = arguments[0]
      if (d.mode && d.mode !== mode) {
        setMode(d.mode === 'max' ? 'x' : d.mode === 'medium' ? 'd' : 'm')
      }
      if (d.state) render(d.state)
      if (d.opacity !== undefined) setAlpha(d.opacity)
    })
  }

  render({ trackName: '', artist: '', coverData: null, isPlaying: false, currentTime: 0, duration: 0, volume: 1 })
  setAlpha(0.85)
  setMode('m')
})()
</script>
</body>
</html>
